[package]
name = "ganis"
version = "0.1.0"
description = "GANIS — Studio de conception narrative"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ganis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# --- Sérialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Base de données (Phase 2) ---
# sqlx gère SQLite, les migrations embarquées et les requêtes async.
# ATTENTION : la feature "macros" est indispensable pour la macro
# sqlx::migrate! utilisée dans db/migrations.rs.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "chrono",
] }

# --- Runtime async (Phase 2) ---
# Nécessaire pour `tokio::sync::Mutex` dans state.rs.
tokio = { version = "1", features = ["sync"] }

# --- Utilitaires ---
chrono = "0.4.45"
uuid = { version = "1.27.0", features = ["v4"] }

# --- Journalisation ---
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
